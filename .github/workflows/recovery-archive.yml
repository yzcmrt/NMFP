name: Recovery source archive
on:
  push:
    branches: [codex/nmfp-recovery]
    paths: [.github/workflows/recovery-archive.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz HEAD -o source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nmfp-recovery-source
          path: source.tar.gz
          retention-days: 1
